# Noor golden set. Questions are self-written; `expect` holds source IDs only, never passage text.
#
# expect formats (a question passes retrieval if ANY retrieved chunk matches ANY entry):
#   <book-id>/<chapter-id>   a chapter of a library book (prefix match: "<book-id>/" = any chapter)
#   quran:<surah>:<ayah>     a retrieved Quran chunk whose ayah range contains this ayah
#   bukhari:<number>         that hadith
# answerable: false          the library can't answer it; the correct behaviour is a refusal.

