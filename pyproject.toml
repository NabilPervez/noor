[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noor"
version = "0.0.1"
description = "Local-first Islamic RAG assistant with a citation for every claim"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "chromadb>=0.5",
  "rank-bm25>=0.2.2",
  "anthropic>=0.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
noor = "noor.cli:app"

[tool.setuptools.packages.find]
include = ["noor*", "ingest*", "rag*", "api*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
